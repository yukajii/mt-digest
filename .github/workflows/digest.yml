name: MT Digest

# ── triggers ────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Announcement date to digest (YYYY-MM-DD). Blank = oldest unsent batch."
        required: false
        type: string
      dry_run:
        description: "Build the issue and print it, but do NOT send to Buttondown."
        required: false
        type: boolean
        default: false
  schedule:
    # arXiv occasionally blocks the runner's shared IP with HTTP 429, so the
    # later times act as reattempts. All three resolve through pick_batch.py,
    # which picks the oldest batch with no sent-artifact: once one run has
    # succeeded the later ones find nothing outstanding and stand down. A run
    # that fails outright leaves its batch outstanding, so the next run simply
    # picks it up again rather than moving on and losing it.
    #
    # Times matter here. A batch is announced at 20:00 ET, which is 00:00 UTC
    # the next day (01:00 in winter), and the API needs a few hours to reflect
    # it. Measured on 2026-09-24: fully indexed 10.2 hours after announcement,
    # zero papers before it. 11:20 UTC is the first run that sits inside the
    # proven range. Moving these earlier risks shipping a partially indexed
    # batch as a short issue and marking it sent.
    - cron: "20 11 * * *"        # daily 11:20 UTC (primary, ~11h after announcement)
    - cron: "20 15 * * *"        # reattempt #1
    - cron: "20 19 * * *"        # reattempt #2

permissions:
  contents: write
  actions: read          # pick_batch lists artifacts to find what is still outstanding
  issues: write          # failure report after the last reattempt of the day

# ── job ─────────────────────────────────────────────────────────────────
jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      # 1. checkout ------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v5

      # 2. pick the batch -----------------------------------------------
      #    Standard library only, so this runs before pip install. It picks
      #    the OLDEST announcement batch that has aged enough and has no
      #    mt_digest_md-<DATE> artifact, rather than deriving a date from
      #    today. The arithmetic it replaced ("today - 5, rolled back to an
      #    announcement day") silently re-targeted Thursday on every
      #    Wednesday and Thursday run, because Friday and Saturday both roll
      #    back to it - the digest went quiet mid-week with five announced
      #    batches sitting unsent.
      - name: Pick batch
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=()
          if [[ -n "${{ github.event.inputs.date }}" ]]; then
            ARGS+=(--date "${{ github.event.inputs.date }}")
          fi
          python3 pick_batch.py "${ARGS[@]}"

      # 4. cache ONLY pip (no HF / torch dirs) ---------------------------
      - name: Cache pip
        if: success() && steps.target.outputs.found == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-mt-digest-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-mt-digest-

      # 5. Python --------------------------------------------------------
      - name: Set up Python
        if: success() && steps.target.outputs.found == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: success() && steps.target.outputs.found == 'true'
        run: pip install -r requirements.txt

      # 5b. cache the sentence-transformer weights -----------------------
      #     e5-large-v2 is a ~1.3 GB download and there are now three
      #     scheduled runs a day, so re-fetching it each time is the single
      #     largest cost in the job.
      - name: Cache HuggingFace models
        if: success() && steps.target.outputs.found == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-e5-large-v2
          restore-keys: ${{ runner.os }}-hf-

      # 6. build ---------------------------------------------------------
      #    The relevance floor can legitimately reject an entire batch, in
      #    which case no .md is written. That is a quiet day, not a failure,
      #    so record it as an output and let the later steps stand down.
      - name: Build digest
        id: build
        if: success() && steps.target.outputs.found == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python mt_arxiv_digest.py "$DATE"
          if [[ -f "mt_digest_${DATE}.md" ]]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No paper in the $DATE batch cleared the relevance floor - nothing to send."
          fi

      # 6b. dry run stops here, after printing what it would have sent.
      #     BUTTONDOWN_TOKEN is never put in this job's environment on a dry
      #     run, so the send cannot happen even by accident.
      - name: Show generated issue (dry run only)
        if: github.event.inputs.dry_run == 'true' && steps.build.outputs.built == 'true'
        run: |
          echo "::notice::DRY RUN - nothing was sent to Buttondown."
          echo "===== mt_digest_${DATE}.md ====="
          cat "mt_digest_${DATE}.md"
          echo "===== end ====="
          echo "===== run log ====="
          cat "logs/mt_digest_${DATE}.log"

      # 6c. send ---------------------------------------------------------
      - name: Send digest
        if: success() && steps.build.outputs.built == 'true' && github.event.inputs.dry_run != 'true'
        env:
          BUTTONDOWN_TOKEN: ${{ secrets.BUTTONDOWN_TOKEN }}
        run: python send_digest.py "mt_digest_${DATE}.md"

      # 6d. stage the issue for yukajii.com ------------------------------
      #     Needs SITE_REPO_TOKEN: a fine-grained PAT with Contents:write and
      #     Pull requests:write on yukajii/yukajii-site. Without it the step
      #     is a no-op, so this can sit here unconfigured.
      #
      #     This pushes to a per-issue branch and opens a pull request. It
      #     deliberately does NOT push to the site's default branch, because
      #     that branch deploys: publishing to a live domain on every send is
      #     a decision to take explicitly, not a side effect of wiring up a
      #     sync. Merging the PR is what publishes.
      - name: Stage issue for yukajii.com
        if: success() && steps.build.outputs.built == 'true' && github.event.inputs.dry_run != 'true'
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          if [[ -z "$SITE_REPO_TOKEN" ]]; then
            echo "::notice::SITE_REPO_TOKEN is not set - skipping the site sync."
            exit 0
          fi

          git clone --depth 1 --quiet \
            "https://x-access-token:${SITE_REPO_TOKEN}@github.com/yukajii/yukajii-site.git" site

          python sync_to_site.py "$DATE" --out site/content/mt-digest

          cd site
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "::notice::nothing new to stage for $DATE."
            exit 0
          fi

          BRANCH="mt-digest/$DATE"
          git config user.name "mt-digest"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git add content/mt-digest
          git commit --quiet -m "Add MT digest issue for $DATE"
          git push --quiet -u origin "$BRANCH"

          gh pr create --repo yukajii/yukajii-site \
            --head "$BRANCH" \
            --title "MT digest issue for $DATE" \
            --body "Generated by the mt-digest workflow. Merging publishes this issue to yukajii.com/mt-digest/$DATE/." \
            || echo "::notice::branch pushed; open the PR manually if one was not created."

      # 7. artefacts (private, 30 d retention) ---------------------------
      # The `mt_digest_md-<DATE>` artifact IS the already-sent marker that
      # check_already_sent.py looks for, so a dry run must never publish it
      # under that name - doing so would make a later real run skip the date.
      - name: Upload Markdown digest
        if: success() && steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mt_digest${{ github.event.inputs.dry_run == 'true' && '_DRYRUN' || '' }}_md-${{ env.DATE }}
          path: mt_digest_${{ env.DATE }}.md
          retention-days: ${{ github.event.inputs.dry_run == 'true' && 7 || 30 }}

      - name: Upload JSON log
        if: success() && steps.target.outputs.found == 'true' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: mt_digest${{ github.event.inputs.dry_run == 'true' && '_DRYRUN' || '' }}_log-${{ env.DATE }}
          path: logs/*.log
          retention-days: ${{ github.event.inputs.dry_run == 'true' && 7 || 30 }}

      # 8. report a failure that the reattempts did not rescue ------------
      #    Only the last cron of the day reports. An earlier run failing on
      #    an arXiv 429 is exactly what the 11:20 and 15:20 reattempts are
      #    for, so filing an issue then would be noise; if 15:20 has also
      #    failed, the digest for this date is genuinely stranded.
      - name: Open failure issue
        if: failure() && github.event.schedule == '20 19 * * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="MT Digest stranded for ${DATE:-unknown date}"
          EXISTING="$(gh issue list --state open --label digest-failure \
                        --search "$TITLE in:title" --json number --jq '.[0].number')"
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh label create digest-failure --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "$TITLE" --label digest-failure \
              --body "All three scheduled attempts failed for \`${DATE:-unknown}\`.

          Last run: $RUN_URL"
          fi
