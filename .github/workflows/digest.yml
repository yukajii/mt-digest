name: MT Digest

# ── triggers ────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to fetch (YYYY-MM-DD). Leave blank for 5 days ago."
        required: false
        type: string
      dry_run:
        description: "Build the issue and print it, but do NOT send to Buttondown."
        required: false
        type: boolean
        default: false
  schedule:
    # arXiv occasionally blocks the runner's shared IP with HTTP 429. These
    # runs all resolve to the SAME target date (5 days ago), so the later
    # times act as reattempts if an earlier one is throttled. The Buttondown
    # send is idempotent and a guard step skips runs whose digest already
    # went out, so extra attempts are cheap no-ops on successful days.
    - cron: "20 7 * * *"         # daily 07:20 UTC (primary)
    - cron: "20 11 * * *"        # reattempt #1
    - cron: "20 15 * * *"        # reattempt #2

permissions:
  contents: write
  actions: read          # guard step lists artifacts to detect an already-sent digest
  issues: write          # failure report after the last reattempt of the day

# ── job ─────────────────────────────────────────────────────────────────
jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      # 1. checkout ------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v5

      # 2. pick the DATE (bash only, no deps) so the guard can run cheaply
      - name: Determine DATE
        run: |
          # DATE is the arXiv ANNOUNCEMENT day whose batch we digest.
          #  - workflow_dispatch + input set → use that
          #  - otherwise → today - 5 days (see DEFAULT_DATE_LAG_DAYS)
          #
          # arXiv announces Sun-Thu only, so Friday and Saturday roll back to
          # Thursday. Sunday is a real announcement day and is left alone.
          # This MUST stay in step with resolve_target_date() in
          # mt_arxiv_digest.py - the guard has to run before pip install, so
          # the rule is deliberately duplicated here in bash.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.date }}" ]]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$(date -u -d '5 days ago' +%F)"
          fi

          DOW="$(date -u -d "$DATE" +%u)"     # 1=Mon .. 5=Fri, 6=Sat, 7=Sun
          if [[ "$DOW" -eq 5 ]]; then
            DATE="$(date -u -d "$DATE -1 day" +%F)"     # Fri -> Thu
          elif [[ "$DOW" -eq 6 ]]; then
            DATE="$(date -u -d "$DATE -2 days" +%F)"    # Sat -> Thu
          fi

          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "Announcement batch (resolved): $DATE ($(date -u -d "$DATE" +%A))"

      # 3. skip guard: if this digest already went out (e.g. an earlier
      #    reattempt today succeeded), skip the heavy steps below and avoid
      #    re-hitting arXiv. Never fails the build (defaults to "proceed").
      #    A dry run deliberately skips this: it never sends, so "already
      #    sent" is not a reason to stop, and re-running a past date is the
      #    whole point of the mode.
      - name: Skip if already sent
        id: guard
        if: github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 check_already_sent.py "$DATE"

      # 4. cache ONLY pip (no HF / torch dirs) ---------------------------
      - name: Cache pip
        if: success() && steps.guard.outputs.already_sent != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-mt-digest-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-mt-digest-

      # 5. Python --------------------------------------------------------
      - name: Set up Python
        if: success() && steps.guard.outputs.already_sent != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: success() && steps.guard.outputs.already_sent != 'true'
        run: pip install -r requirements.txt

      # 5b. cache the sentence-transformer weights -----------------------
      #     e5-large-v2 is a ~1.3 GB download and there are now three
      #     scheduled runs a day, so re-fetching it each time is the single
      #     largest cost in the job.
      - name: Cache HuggingFace models
        if: success() && steps.guard.outputs.already_sent != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-e5-large-v2
          restore-keys: ${{ runner.os }}-hf-

      # 6. build ---------------------------------------------------------
      - name: Build digest
        if: success() && steps.guard.outputs.already_sent != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python mt_arxiv_digest.py "$DATE"

      # 6b. dry run stops here, after printing what it would have sent.
      #     BUTTONDOWN_TOKEN is never put in this job's environment on a dry
      #     run, so the send cannot happen even by accident.
      - name: Show generated issue (dry run only)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::DRY RUN - nothing was sent to Buttondown."
          echo "===== mt_digest_${DATE}.md ====="
          cat "mt_digest_${DATE}.md"
          echo "===== end ====="
          echo "===== run log ====="
          cat "logs/mt_digest_${DATE}.log"

      # 6c. send ---------------------------------------------------------
      - name: Send digest
        if: success() && steps.guard.outputs.already_sent != 'true' && github.event.inputs.dry_run != 'true'
        env:
          BUTTONDOWN_TOKEN: ${{ secrets.BUTTONDOWN_TOKEN }}
        run: python send_digest.py "mt_digest_${DATE}.md"

      # 7. artefacts (private, 30 d retention) ---------------------------
      # The `mt_digest_md-<DATE>` artifact IS the already-sent marker that
      # check_already_sent.py looks for, so a dry run must never publish it
      # under that name - doing so would make a later real run skip the date.
      - name: Upload Markdown digest
        if: success() && steps.guard.outputs.already_sent != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mt_digest${{ github.event.inputs.dry_run == 'true' && '_DRYRUN' || '' }}_md-${{ env.DATE }}
          path: mt_digest_${{ env.DATE }}.md
          retention-days: ${{ github.event.inputs.dry_run == 'true' && 7 || 30 }}

      - name: Upload JSON log
        if: success() && steps.guard.outputs.already_sent != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mt_digest${{ github.event.inputs.dry_run == 'true' && '_DRYRUN' || '' }}_log-${{ env.DATE }}
          path: logs/*.log
          retention-days: ${{ github.event.inputs.dry_run == 'true' && 7 || 30 }}

      # 8. report a failure that the reattempts did not rescue ------------
      #    Only the last cron of the day reports. An earlier run failing on
      #    an arXiv 429 is exactly what the 11:20 and 15:20 reattempts are
      #    for, so filing an issue then would be noise; if 15:20 has also
      #    failed, the digest for this date is genuinely stranded.
      - name: Open failure issue
        if: failure() && github.event.schedule == '20 15 * * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="MT Digest stranded for ${DATE:-unknown date}"
          EXISTING="$(gh issue list --state open --label digest-failure \
                        --search "$TITLE in:title" --json number --jq '.[0].number')"
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh label create digest-failure --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "$TITLE" --label digest-failure \
              --body "All three scheduled attempts failed for \`${DATE:-unknown}\`.

          Last run: $RUN_URL"
          fi
